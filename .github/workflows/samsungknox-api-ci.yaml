name: Samsungknox-api CI
on:
  pull_request:
    paths:
      - packages/knox-api/**
      - packages/knox-token-library/**
      - biome.json
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - .github/workflows/samsungknox-api-ci.yaml

jobs:
  everything:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v1
  
      - name: Export .env
        working-directory: packages/knox-api
        run: doppler secrets download --no-file --format env-no-quotes > .env
        env: 
          DOPPLER_TOKEN: ${{ secrets.TEST_DOPPLER_TOKEN }}

      - name: Lint Format
        working-directory: packages/knox-api
        run: pnpm lint:format

      - name: Build Knox-Token-Library
        working-directory: packages/knox-token-library
        run: pnpm build

      - name: Type Check
        working-directory: packages/knox-api
        run: pnpm type-check

      - name: Lint
        working-directory: packages/knox-api
        run: pnpm lint

      - name: Test
        working-directory: packages/knox-api
        run: pnpm test:coverage

      - name: Build
        working-directory: packages/knox-api
        run: pnpm build

      - name: 'Report Coverage'
        uses:  davelosert/vitest-coverage-report-action@v2
        if: always()
        with: 
          working-directory:  packages/knox-api
